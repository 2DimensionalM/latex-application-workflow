<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>求职简历工作台</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#5a6472; --accent:#1f4e79; --rule:#dde3ea;
          --ok:#1e7a46; --bad:#b3261e; --soft:#eef3f8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --card:#1d232b; --ink:#e6eaf0; --muted:#9aa5b3;
          --accent:#7fb2e5; --rule:#2f3743; --ok:#6fcf97; --bad:#f2948c; --soft:#232b35; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,"Segoe UI",sans-serif; }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin:0 0 12px; }
  section { background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 10px; color:var(--accent); }
  input, textarea, select, button { font:inherit; color:inherit; }
  input[type=text], textarea, select { width:100%; padding:8px; border:1px solid var(--rule); border-radius:6px; background:var(--bg); }
  textarea { min-height:80px; margin-top:8px; }
  button { padding:7px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  .actions button, .actions a { white-space:nowrap; }
  button:disabled { opacity:.5; cursor:wait; }
  a { color:var(--accent); }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:10px 16px; min-width:120px; }
  .stat b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:12px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--rule); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:12px; white-space:nowrap; }
  td.num, td.date { font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--muted); }
  td select { width:auto; }
  tr.group-head td { background:var(--soft); color:var(--muted); font-size:12px; font-weight:600; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  /* progress panel */
  .job { margin-top:12px; border:1px solid var(--rule); border-radius:8px; padding:12px; background:var(--bg); }
  .job-head { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:600; }
  .job-head .time { color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums; }
  .job ul { margin:10px 0 0; padding:0; list-style:none; max-height:240px; overflow:auto; counter-reset:step; }
  .job li { margin:2px 0; padding-left:28px; position:relative; }
  .job li.tool::before { counter-increment:step; content:counter(step) "."; position:absolute; left:0; width:22px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .job li.note { color:var(--muted); font-style:italic; }
  .job li.error { color:var(--bad); }
  .result { margin-top:10px; padding:10px; border-radius:6px; white-space:pre-wrap; background:var(--card); border:1px solid var(--rule); }
  .result.ok { border-color:var(--ok); }
  .result.bad { border-color:var(--bad); }
  .spin { display:inline-block; width:10px; height:10px; border:2px solid var(--accent); border-right-color:transparent; border-radius:50%; animation:spin 1s linear infinite; margin-right:6px; vertical-align:-1px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .job details { margin-top:8px; color:var(--muted); font-size:12px; }
  pre.letter { background:var(--bg); border:1px solid var(--rule); border-radius:6px; padding:12px; white-space:pre-wrap; margin:10px 0 0; }
  iframe { width:100%; height:80vh; border:1px solid var(--rule); border-radius:6px; background:#fff; margin-top:8px; }
  .muted { color:var(--muted); }
  /* fact library */
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tabs button { background:transparent; color:var(--ink); border-color:var(--rule); }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .badge { display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:9px; font-size:11px; line-height:18px; text-align:center; background:var(--bad); color:#fff; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .bar .status { color:var(--muted); font-size:12px; margin-left:auto; }
  textarea.md { width:100%; min-height:62vh; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; margin:0; }
  .md-view { max-height:62vh; overflow:auto; padding:4px 12px; border:1px solid var(--rule); border-radius:6px; background:var(--bg); }
  .md-view h1 { font-size:18px; } .md-view h2 { font-size:15px; margin:18px 0 6px; } .md-view h3 { font-size:14px; margin:14px 0 4px; }
  .md-view table { margin:6px 0; font-size:13px; } .md-view th, .md-view td { border:1px solid var(--rule); padding:4px 8px; }
  .md-view code { background:var(--soft); padding:1px 4px; border-radius:4px; font-size:12.5px; }
  .md-view ul { margin:4px 0; padding-left:20px; }
  .md-view hr { border:0; border-top:1px solid var(--rule); margin:14px 0; }
  mark.nv { background:#f6d36b; color:#1c2430; padding:0 3px; border-radius:3px; }
  @media (max-width:760px) { .hide-m { display:none; } }
</style>
</head>
<body>
<main>
  <h1>求职简历工作台</h1>
  <div class="stats" id="stats"></div>

  <section>
    <h2>新建申请</h2>
    <input type="text" id="url" placeholder="粘贴职位链接 (https://...)">
    <textarea id="jd" placeholder="或者直接粘贴 JD 文本(链接读不了时用这个)"></textarea>
    <div class="actions" style="margin-top:8px"><button id="go">生成定制简历</button></div>
    <div id="applyJob"></div>
  </section>

  <section>
    <h2>投递看板</h2>
    <div class="table-wrap">
    <table>
      <thead><tr><th>编号</th><th>公司</th><th>职位</th><th class="hide-m">地点</th><th>登记</th><th>投递</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="muted">加载中…</td></tr></tbody>
    </table>
    </div>
  </section>

  <section id="facts">
    <h2>事实库 <span class="muted" style="font-weight:400;font-size:12px">content/master/*.md · 改事实只改这里,保存后可重新生成母版简历</span></h2>
    <div class="tabs" id="factTabs"></div>
    <div class="bar">
      <button class="ghost" id="factMode">编辑</button>
      <button id="factSave" hidden>保存</button>
      <button class="ghost" id="factRender">重新生成母版简历</button>
      <button class="ghost" id="factPdf">查看母版 PDF</button>
      <span class="status" id="factStatus"></span>
    </div>
    <div class="md-view" id="factView"></div>
    <textarea class="md" id="factEdit" spellcheck="false" hidden></textarea>
  </section>

  <section id="viewer" hidden>
    <h2 id="vtitle"></h2>
    <div class="actions"><button class="ghost" id="openPdf">新窗口打开 / 下载 PDF</button><button class="ghost" id="closeV">关闭</button></div>
    <iframe id="pv"></iframe>
    <div id="clJob"></div>
    <pre class="letter" id="cl" hidden></pre>
    <div id="revise" hidden style="margin-top:12px">
      <h2 style="margin-top:4px">不满意?告诉 Claude 怎么改</h2>
      <textarea id="reviseText" placeholder="例如:Profile 更突出 dashboard 和报表自动化;把 Baijiu 项目放到第一个;Vizard 第二条写得更短。Claude 只会用事实库里已有的内容,不会编造。"></textarea>
      <div class="actions" style="margin-top:8px"><button id="reviseGo">让 Claude 修改</button><span class="muted" style="font-size:12px">修改前会自动备份当前版本到 targets/&lt;slug&gt;/.history/</span></div>
      <div id="reviseJob"></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post = (u, b) => fetch(u, {method:'POST', body:JSON.stringify(b||{})}).then(r => r.json());
const GROUPS = ['准备中', '已投递 / 流程中', '已结束'];
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

async function load() {
  const {targets, labels} = await fetch('/api/targets').then(r => r.json());
  const count = g => targets.filter(t => t.group === g).length;
  const applied = targets.filter(t => t.group >= 1).length;
  $('stats').innerHTML = [
    [targets.length, '岗位总数'], [applied, '已投递(含结果)'], [count(0), '准备中'], [count(1), '流程中'], [count(2), '已结束'],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  if (!targets.length) { $('rows').innerHTML = '<tr><td colspan="8" class="muted">还没有申请</td></tr>'; return; }
  let html = '', last = -1;
  for (const t of targets) {
    if (t.group !== last) { last = t.group; html += `<tr class="group-head"><td colspan="8">${GROUPS[t.group]} · ${count(t.group)}</td></tr>`; }
    const opts = labels.includes(t.progress) ? labels : [t.progress, ...labels];
    html += `<tr>
      <td class="num">${esc(t.id)}</td>
      <td>${esc(t.company)}</td>
      <td>${esc(t.role)}</td>
      <td class="hide-m">${esc(t.location)}</td>
      <td class="date">${esc(t.date_saved) || '—'}</td>
      <td class="date">${esc(t.date_applied) || '—'}</td>
      <td><select data-slug="${t.slug}">${opts.map(s => `<option ${s===t.progress?'selected':''}>${esc(s)}</option>`).join('')}</select></td>
      <td><div class="actions">
        ${t.resume_is_html ? `<button class="ghost" data-prev="${t.slug}">简历预览 / 修改</button>` : ''}
        <button class="ghost" data-cl="${t.slug}">${t.has_cover_letter ? '求职信 / 修改' : '生成求职信'}</button>
        ${t.source_url ? `<a href="${esc(t.source_url)}" target="_blank" rel="noopener">职位页</a>` : ''}
      </div></td>
    </tr>`;
  }
  $('rows').innerHTML = html;
}

// Progress panel: readable steps while Claude works, result at the end, raw log on demand.
function watch(job, box, title, done) {
  const tick = async () => {
    const j = await fetch('/api/jobs/' + job).then(r => r.json());
    const running = j.state === 'running';
    const icon = running ? '<span class="spin"></span>' : j.state === 'done' ? '✓ ' : '✗ ';
    const state = running ? '进行中' : j.state === 'done' ? '已完成' : '失败';
    const steps = (j.steps || []).map(s => `<li class="${s.kind}">${esc(s.text)}</li>`).join('');
    const result = !running && j.result ? `<div class="result ${j.state === 'done' ? 'ok' : 'bad'}">${esc(j.result)}</div>` : '';
    box.innerHTML = `<div class="job">
      <div class="job-head"><span>${icon}${esc(title)} · ${state}</span><span class="time">${mmss(j.elapsed || 0)} · ${(j.steps||[]).filter(s => s.kind==='tool').length} 步</span></div>
      ${steps ? `<ul>${steps}</ul>` : '<div class="muted" style="margin-top:8px">正在启动 Claude…</div>'}
      ${result}
      <details><summary>原始日志</summary><a href="/api/jobs/${job}/log" target="_blank">在新窗口查看</a></details>
    </div>`;
    const ul = box.querySelector('ul'); if (ul) ul.scrollTop = ul.scrollHeight;
    if (running) return setTimeout(tick, 1500);
    done(j);
  };
  tick();
}

$('go').onclick = async () => {
  const url = $('url').value.trim(), jd = $('jd').value.trim();
  if (!url && !jd) return alert('请先粘贴职位链接或 JD 文本');
  $('go').disabled = true;
  const r = await post('/api/apply', {url, jd});
  if (r.error) { $('go').disabled = false; return alert(r.error); }
  watch(r.job, $('applyJob'), '生成定制简历', j => {
    $('go').disabled = false;
    if (j.need_jd) alert('链接读不了,请把 JD 文本粘贴到下面的框里再试一次。');
    load();
  });
};

$('rows').onchange = async e => {
  const slug = e.target.dataset.slug;
  if (!slug) return;
  if (!confirm(`把状态改为「${e.target.value}」?只有真实发生的事件才应该记录。`)) return load();
  const r = await post(`/api/targets/${slug}/progress`, {label: e.target.value}); if (r.error) alert(r.error);
  load();
};

const viewing = {slug: null, kind: null};
function showRevise(slug, kind) {
  Object.assign(viewing, {slug, kind});
  $('revise').hidden = !kind; $('reviseJob').innerHTML = '';
  $('reviseText').placeholder = kind === 'letter'
    ? '例如:第一段开头更具体地写为什么是这家公司;第四段的入职计划写得更具体;整体再短一点。'
    : '例如:Profile 更突出 dashboard 和报表自动化;把 Baijiu 项目放到第一个;Vizard 第二条写得更短。Claude 只会用事实库里已有的内容,不会编造。';
}
$('reviseGo').onclick = async () => {
  const instruction = $('reviseText').value.trim();
  if (!instruction) return alert('先写下你想怎么改');
  const {slug, kind} = viewing;
  $('reviseGo').disabled = true;
  const r = await post(`/api/targets/${slug}/revise`, {kind, instruction});
  if (r.error) { $('reviseGo').disabled = false; return alert(r.error); }
  watch(r.job, $('reviseJob'), kind === 'letter' ? '修改求职信' : '修改简历', async j => {
    $('reviseGo').disabled = false;
    if (j.state === 'done') $('reviseText').value = '';
    if (kind === 'resume') $('pv').src = `/preview/${slug}?t=${Date.now()}`;
    else { const t = await fetch(`/api/targets/${slug}/cover-letter`).then(r => r.json()); $('cl').textContent = t.text; }
  });
};

$('rows').onclick = async e => {
  const prev = e.target.dataset.prev, cl = e.target.dataset.cl;
  if (prev) {
    show(prev, '简历预览'); $('pv').hidden = false; $('openPdf').hidden = false; $('cl').hidden = true; $('clJob').innerHTML = '';
    $('pv').src = '/preview/' + prev; showRevise(prev, 'resume');
  }
  if (cl) {
    show(cl, '求职信'); $('pv').hidden = true; $('openPdf').hidden = true; $('pv').src = 'about:blank';
    const {text} = await fetch(`/api/targets/${cl}/cover-letter`).then(r => r.json());
    showRevise(cl, text ? 'letter' : null);
    if (text) { $('clJob').innerHTML = ''; $('cl').hidden = false; return $('cl').textContent = text; }
    $('cl').hidden = true;
    const r = await post(`/api/targets/${cl}/cover-letter`);
    if (r.error) return alert(r.error);
    watch(r.job, $('clJob'), '生成求职信', async () => {
      const t = await fetch(`/api/targets/${cl}/cover-letter`).then(r => r.json());
      if (t.text) { $('cl').hidden = false; $('cl').textContent = t.text; showRevise(cl, 'letter'); }
      load();
    });
  }
};
function show(slug, label) { $('viewer').hidden = false; $('vtitle').textContent = `${label} · ${slug}`; $('viewer').scrollIntoView({behavior:'smooth'}); }
$('openPdf').onclick = () => window.open($('pv').src);
$('closeV').onclick = () => { $('viewer').hidden = true; $('pv').src = 'about:blank'; };
load();

// ---- fact library ----
const fact = {name: null, sha: '', saved: '', draft: '', editing: false};
const NAMES = {profile:'个人概况', education:'教育', experience:'经历', projects:'项目', skills:'技能', certifications:'证书'};
function inline(t) {
  return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<i>$1</i>').replace(/Need verification/g, '<mark class="nv">Need verification</mark>');
}
function mdToHtml(md) {
  const out = []; const lines = md.split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^#{1,4} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`); i++; continue; }
    if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (l.startsWith('|')) {
      const rows = []; while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\|\s*-/.test(r));
      out.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    if (/^\s*- /.test(l)) {
      let html = '', depth = -1;
      while (i < lines.length && /^\s*- /.test(lines[i])) {
        const d = Math.floor(lines[i].match(/^\s*/)[0].length / 2);
        while (depth < d) { html += '<ul>'; depth++; }
        while (depth > d) { html += '</ul>'; depth--; }
        html += `<li>${inline(lines[i].replace(/^\s*- /, ''))}</li>`; i++;
      }
      while (depth-- >= 0) html += '</ul>';
      out.push(html); continue;
    }
    if (l.trim()) out.push(`<p>${inline(l)}</p>`);
    i++;
  }
  return out.join('\n');
}
const sync = () => { if (fact.editing) fact.draft = $('factEdit').value; };
const dirty = () => { sync(); return fact.name && fact.draft !== fact.saved; };
async function factTabs() {
  const {files} = await fetch('/api/master').then(r => r.json());
  $('factTabs').innerHTML = files.map(f => `<button data-f="${f.name}" class="${f.name === fact.name ? 'on' : ''}">${NAMES[f.name] || f.name}${f.need_verification ? `<span class="badge" title="Need verification">${f.need_verification}</span>` : ''}</button>`).join('');
  return files;
}
function status() {
  $('factStatus').textContent = `${fact.name}.md` + (dirty() ? ' · 有未保存的修改' : '');
  $('factSave').hidden = !dirty();
}
async function openFact(name) {
  if (dirty() && !confirm('当前文件有未保存的修改,放弃并切换?')) return;
  const f = await fetch('/api/master/' + name).then(r => r.json());
  Object.assign(fact, {name, sha: f.sha, saved: f.text, draft: f.text});
  setMode(false); factTabs(); status();
}
function setMode(editing) {
  sync(); fact.editing = editing;
  $('factView').hidden = editing; $('factEdit').hidden = !editing;
  $('factMode').textContent = editing ? '预览' : '编辑';
  if (editing) { $('factEdit').value = fact.draft; $('factEdit').focus(); } else $('factView').innerHTML = mdToHtml(fact.draft);
}
$('factTabs').onclick = e => { const b = e.target.closest('button'); if (b) openFact(b.dataset.f); };
$('factMode').onclick = () => setMode(!fact.editing);
$('factEdit').oninput = status;
$('factSave').onclick = async () => {
  sync();
  const r = await post('/api/master/' + fact.name, {text: fact.draft, sha: fact.sha});
  if (r.error) return alert(r.error);
  Object.assign(fact, {sha: r.sha, saved: fact.draft}); setMode(false); factTabs(); status();
  $('factStatus').textContent += ` · 已保存 ${new Date().toLocaleTimeString()}(旧版本备份在 content/master/.history/)`;
};
$('factRender').onclick = async () => {
  if (dirty() && !confirm('当前修改还没保存,生成会用已保存的版本。继续?')) return;
  $('factRender').disabled = true; $('factStatus').textContent = '正在生成母版简历…';
  const r = await post('/api/master/render');
  $('factRender').disabled = false;
  if (r.error) { $('factStatus').textContent = ''; return alert(r.error); }
  const fill = r.body_end_fraction ? Math.round(r.body_end_fraction * 100) + '%' : '—';
  $('factStatus').textContent = (r.errors && r.errors.length ? '⚠ ' + r.errors.join('; ') : `✓ 母版已更新:${r.pages} 页,内容到页面 ${fill}`)
    + (r.warnings && r.warnings.length ? ' · ' + r.warnings.join('; ') : '');
};
$('factPdf').onclick = () => {
  show('master', '母版简历'); showRevise(null, null); $('pv').hidden = false; $('openPdf').hidden = false; $('cl').hidden = true; $('clJob').innerHTML = '';
  $('pv').src = '/preview/master?t=' + Date.now();
};
window.addEventListener('beforeunload', e => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });
factTabs().then(files => files.length && openFact(files[0].name));
</script>
</body>
</html>
